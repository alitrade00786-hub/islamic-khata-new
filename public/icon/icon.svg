<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063f2b"/>
      <stop offset="55%" stop-color="#08734d"/>
      <stop offset="100%" stop-color="#022d20"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="35%" stop-color="#e8c45a"/>
      <stop offset="70%" stop-color="#b88624"/>
      <stop offset="100%" stop-color="#ffe58a"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="8"
                    flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Premium app background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Subtle Islamic pattern -->
  <g opacity="0.08" fill="none" stroke="#ffffff" stroke-width="3">
    <path d="M256 35 L477 163 L477 349 L256 477 L35 349 L35 163 Z"/>
    <path d="M256 70 L438 175 L438 337 L256 442 L74 337 L74 175 Z"/>
    <path d="M256 105 L399 188 L399 324 L256 407 L113 324 L113 188 Z"/>
  </g>

  <!-- Golden crescent -->
  <path d="M205 78
           C165 95 145 136 151 177
           C158 224 198 253 240 250
           C207 233 188 201 188 166
           C188 129 207 99 237 84
           C227 78 216 76 205 78Z"
        fill="url(#gold)"
        filter="url(#shadow)"/>

  <!-- Star -->
  <path d="M275 91
           L283 111
           L305 112
           L288 125
           L294 147
           L275 134
           L256 147
           L262 125
           L245 112
           L267 111 Z"
        fill="url(#gold)"/>

  <!-- Mosque dome -->
  <path d="M148 300
           Q256 205 364 300
           L364 315
           L148 315 Z"
        fill="url(#gold)"
        filter="url(#shadow)"/>

  <!-- Dome finial -->
  <path d="M256 210 L256 190
           M246 190 Q256 178 266 190
           M256 178 L256 166"
        stroke="url(#gold)"
        stroke-width="8"
        stroke-linecap="round"
        fill="none"/>

  <!-- Mosque building -->
  <rect x="160" y="310" width="192" height="92"
        rx="5" fill="#f7e8b0"/>

  <!-- Door -->
  <path d="M238 402 V355
           Q256 331 274 355 V402 Z"
        fill="#064532"/>

  <!-- Windows -->
  <path d="M180 344 Q180 329 195 329 Q210 329 210 344 V365 H180 Z"
        fill="#08734d"/>
  <path d="M302 344 Q302 329 317 329 Q332 329 332 344 V365 H302 Z"
        fill="#08734d"/>

  <!-- Minarets -->
  <rect x="125" y="265" width="30" height="137" rx="4"
        fill="#f7e8b0"/>
  <rect x="357" y="265" width="30" height="137" rx="4"
        fill="#f7e8b0"/>

  <path d="M119 266 L140 239 L161 266 Z" fill="url(#gold)"/>
  <path d="M351 266 L372 239 L393 266 Z" fill="url(#gold)"/>

  <!-- Minaret balconies -->
  <rect x="119" y="286" width="42" height="9" rx="3"
        fill="url(#gold)"/>
  <rect x="351" y="286" width="42" height="9" rx="3"
        fill="url(#gold)"/>

  <!-- App name panel -->
  <rect x="72" y="421" width="368" height="62"
        rx="31"
        fill="#021f16"
        stroke="url(#gold)"
        stroke-width="3"/>

  <!-- Islamic Khata text -->
  <text x="256" y="463"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="35"
        font-weight="bold"
        letter-spacing="1.5"
        fill="url(#gold)">
    Islamic Khata
  </text>
</svg>
